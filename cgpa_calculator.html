<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CGPA to Percentage Report</title>
  <style>
    :root {
      --primary-color: #3498db;
      --light-bg: #f4f6f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--light-bg);
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.8rem;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      font-size: 0.95rem;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 20px;
      margin-top: 20px;
      border: none;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #2980b9;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 14px;
    }

    .footer a {
      color: var(--primary-color);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      input, .btn {
        font-size: 1rem;
      }

      th, td {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>CGPA to Percentage Report</h2>
  <label>Name: <input type="text" id="name"/></label>
  <label>Roll Number: <input type="text" id="roll"/></label>
  <label>College Name: <input type="text" id="college"/></label>
  <label>Number of Semesters: <input type="number" id="semesters"/></label>
  <button class="btn" onclick="collectCGPAs()">Enter CGPAs</button>

  <div id="cgpaInputs"></div>
  <div id="results"></div>

  <button class="btn" onclick="clearAll()">Clear All</button>
</div>

<div class="footer">
  <hr/>
  <p><strong>Made by Amey Mali</strong><br/>
    📧 <a href="mailto:ameymali2@gmail.com">ameymali2@gmail.com</a><br/>
    📞 Contact: 7517359266
  </p>
</div>

<script>
  let cgpaInputsCreated = false;

  function collectCGPAs() {
    const semCount = parseInt(document.getElementById('semesters').value);
    const cgpaDiv = document.getElementById('cgpaInputs');
    cgpaDiv.innerHTML = "";

    if (!semCount || semCount <= 0) {
      alert("Please enter a valid number of semesters.");
      return;
    }

    for (let i = 1; i <= semCount; i++) {
      cgpaDiv.innerHTML += `
        <label>Semester ${i} CGPA: <input type="number" step="0.01" id="cgpa_${i}" /></label>
      `;
    }

    cgpaInputsCreated = true;
    cgpaDiv.innerHTML += `<button class="btn" onclick="showResults()">Calculate</button>`;
  }

  function calculatePercentage(cgpa) {
    return cgpa < 7 ? 7.1 * cgpa + 12 : 7.4 * cgpa + 12;
  }

  function showResults() {
    if (!cgpaInputsCreated) return;

    const name = document.getElementById('name').value.trim();
    const roll = document.getElementById('roll').value.trim();
    const college = document.getElementById('college').value.trim();
    const semCount = parseInt(document.getElementById('semesters').value);

    if (!name || !roll || !college) {
      alert("Please fill in all student details.");
      return;
    }

    const cgpas = [];
    for (let i = 1; i <= semCount; i++) {
      const val = parseFloat(document.getElementById(`cgpa_${i}`).value);
      if (isNaN(val) || val < 0 || val > 10) {
        alert(`Invalid CGPA for Semester ${i}`);
        return;
      }
      cgpas.push(val);
    }

    const percentages = cgpas.map(calculatePercentage);
    const avgCgpa = cgpas.reduce((a, b) => a + b, 0) / cgpas.length;
    const avgPercent = percentages.reduce((a, b) => a + b, 0) / percentages.length;

    let resultHTML = "<h3>Semester-wise Results</h3><table><tr><th>Semester</th><th>CGPA</th><th>Percentage</th></tr>";
    cgpas.forEach((cgpa, index) => {
      resultHTML += `<tr><td>Semester ${index + 1}</td><td>${cgpa.toFixed(2)}</td><td>${percentages[index].toFixed(2)}%</td></tr>`;
    });
    resultHTML += `</table>
      <p><strong>Aggregate CGPA:</strong> ${avgCgpa.toFixed(2)}</p>
      <p><strong>Aggregate Percentage:</strong> ${avgPercent.toFixed(2)}%</p>
    `;

    document.getElementById('results').innerHTML = resultHTML;
  }

  // Clear all inputs and results
  function clearAll() {
    document.getElementById('name').value = "";
    document.getElementById('roll').value = "";
    document.getElementById('college').value = "";
    document.getElementById('semesters').value = "";
    document.getElementById('cgpaInputs').innerHTML = "";
    document.getElementById('results').innerHTML = "";
  }
</script>

</body>
</html>
